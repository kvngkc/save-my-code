name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Demo scan must block
        run: |
          set +e
          node dist/cli.js scan examples/naija-clinic-bookings --no-external --quiet --out /tmp/smc
          test $? -eq 1
